name: 'Release'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Creates the draft release exactly once, before the (parallel) build
  # matrix runs. Without this, each matrix job raced to create the release
  # for the same tag and produced one draft per platform. Idempotent: a
  # re-run reuses the draft already created for the tag.
  create-release:
    runs-on: 'ubuntu-latest'
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Create (or reuse) the draft release
        id: create-release
        uses: actions/github-script@v7
        env:
          TAG: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.TAG;
            const isPrerelease = /-(beta|alpha|rc)/.test(tag);
            const { owner, repo } = context.repo;
            // A draft release is not returned by getReleaseByTag: scan the list
            let release = null;
            for await (const res of github.paginate.iterator(
              github.rest.repos.listReleases, { owner, repo, per_page: 100 })) {
              release = res.data.find(r => r.tag_name === tag);
              if (release) break;
            }
            if (!release) {
              ({ data: release } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `Wysiwyl ${tag}`,
                body: 'Voir les changements dans le CHANGELOG ou les commits associés.',
                draft: true,
                prerelease: isPrerelease,
              }));
            }
            return release.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install npm dependencies
        run: npm install

      # The release already exists (see create-release): passing its id makes
      # tauri-action upload to it directly instead of racing to create one.
      # `tagName` is still passed so `latest.json` points to
      # releases/download/<tag>/… (and not releases/latest/…, which is broken
      # for pre-releases).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (the app's own minisign key, unrelated
          # to the Apple code signing). Without these the bundler fails once
          # `bundle.createUpdaterArtifacts` is enabled. The release stays a
          # draft: publish it manually to make `latest.json` reachable by the
          # auto-updater.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}
