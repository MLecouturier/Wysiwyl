<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wysiwyl</title>
    <link rel="icon" href="assets/icon.png" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <div class="app-container">

        <!-- Left column: variable width -->
        <div class="column column-left">
            <div class="content-area image-viewer-container" id="image-viewer-container" tabindex="-1">
                <div id="image-viewer" class="image-viewer">
                    <canvas id="processed-preview" class="processed-preview hidden"></canvas>
                    <img id="preview" data-i18n-alt="viewer.previewAlt" class="hidden" />
                    <canvas id="pixel-overlay" class="pixel-overlay"></canvas>
                    <canvas id="cursor-overlay" class="cursor-overlay"></canvas>
                    <p id="viewer-empty" class="text-muted italic" data-i18n="viewer.noImage"></p>
                </div>

                <div id="controls" class="controls">
                    <div class="flex flex-auto items-center justify-between gap-2 mb-3 relative h-full">
                        <div class="controls-image controls-column-left flex flex-col gap-2 h-full flex-auto">
                            <div class="flex flex-auto items-center justify-between gap-2">
                                <button id="load-btn" class="primary" data-i18n-title="controls.load">
                                    <span class="material-symbols-outlined" aria-hidden="true">image_search</span>
                                </button>
                                <div class="flex-fill">
                                    <p id="dimensions-info" class="text-xs text-muted tabular-nums"></p>
                                </div>
                            </div>

                            <div class="flex flex-auto items-center justify-between gap-2">
                                <button id="auto-levels-btn" class="icon-btn" data-i18n-title="controls.autoLevels">
                                    <span class="material-symbols-outlined" aria-hidden="true">auto_awesome</span>
                                </button>
                                <div class="flex-none w-4"></div>
                                <button id="rotate-img-btn" class="icon-btn" data-i18n-title="controls.rotate">
                                    <span class="material-symbols-outlined" aria-hidden="true">rotate_90_degrees_cw</span>
                                </button>
                                <button id="crop-img-btn" class="icon-btn" data-i18n-title="controls.crop">
                                    <span class="material-symbols-outlined" aria-hidden="true">crop</span>
                                </button>
                                <button id="transform-img-btn" class="icon-btn" data-i18n-title="controls.transform">
                                    <span class="material-symbols-outlined" aria-hidden="true">tune</span>
                                </button>
                                <div class="flex-none w-4"></div>
                                <label class="flex-auto columns-control" data-i18n-title="controls.columns">
                                    <span class="control-head"><span data-i18n="controls.columns"></span> <span id="grid-width-value" class="control-value">-</span></span>
                                    <input type="range" id="grid-width" min="0" max="1000" value="1000" />
                                </label>
                                <div class="flex-none w-4"></div>
                                <button id="reset-btn" class="icon-btn" data-i18n-title="controls.reset">
                                    <span class="material-symbols-outlined" aria-hidden="true">reset_settings</span>
                                </button>
                            </div>

                            <div class="flex flex-auto items-center justify-between gap-2 mb-3 relative h-full">
                                <!-- Interactive modes: panels overlaying the sliders of this row -->
                                <div id="crop-bar" class="mode-panel hidden">
                                    <div class="mode-bar flex-auto">
                                        <span class="text-sm text-muted" data-i18n="controls.cropHint"></span>
                                    </div>
                                    <div class="mode-bar flex-auto">
                                        <div id="crop-ratio-group" class="ratio-group" data-i18n-title="controls.cropRatio">
                                            <button class="toggle-btn ratio-btn active" data-crop-ratio="" data-i18n="controls.cropRatioFree"></button>
                                            <button class="toggle-btn ratio-btn" data-crop-ratio="1">1:1</button>
                                            <button class="toggle-btn ratio-btn" data-crop-ratio="4/3">4:3</button>
                                            <button class="toggle-btn ratio-btn" data-crop-ratio="3/2">3:2</button>
                                            <button class="toggle-btn ratio-btn" data-crop-ratio="16/9">16:9</button>
                                        </div>
                                    </div>
                                    <div class="flex-fill"></div>
                                    <div class="mode-bar flex-auto">
                                        <div class="flex-fill"></div>
                                        <button id="crop-apply-btn" class="primary" data-i18n="controls.apply" disabled></button>
                                        <button id="crop-cancel-btn" class="secondary" data-i18n="controls.cancel"></button>
                                    </div>
                                </div>
                                <div id="transform-panel" class="mode-panel hidden">
                                    <div class="flex flex-auto items-center gap-4">
                                        <div class="w-2-5">
                                            <button id="transform-grid-btn" class="toggle-btn active" data-i18n-title="controls.transformGrid">
                                                <span class="material-symbols-outlined" aria-hidden="true">grid_3x3</span>
                                            </button>
                                        </div>
                                        <label class="w-2-5">
                                            <span class="control-head"><span data-i18n="controls.rotation"></span> <span id="transform-rotation-value" class="control-value">0°</span></span>
                                            <input type="range" id="transform-rotation" min="-45" max="45" value="0" step="0.1" />
                                        </label>
                                    </div>
                                    <div class="flex flex-auto items-center gap-4">
                                        <label class="w-2-5">
                                            <span class="control-head"><span data-i18n="controls.perspectiveV"></span> <span id="transform-persp-v-value" class="control-value">0</span></span>
                                            <input type="range" id="transform-persp-v" min="-50" max="50" value="0" step="1" />
                                        </label>
                                        <label class="w-2-5">
                                            <span class="control-head"><span data-i18n="controls.perspectiveH"></span> <span id="transform-persp-h-value" class="control-value">0</span></span>
                                            <input type="range" id="transform-persp-h" min="-50" max="50" value="0" step="1" />
                                        </label>
                                    </div>
                                    <div class="mode-bar flex-auto">
                                        <div class="flex-fill"></div>
                                        <button id="transform-apply-btn" class="primary" data-i18n="controls.apply"></button>
                                        <button id="transform-cancel-btn" class="secondary" data-i18n="controls.cancel"></button>
                                    </div>
                                </div>

                                <div class="controls-set flex flex-col gap-2 flex-auto h-full">
                                    <label data-i18n-title="controls.brightness">
                                        <span class="control-head"><span data-i18n="controls.brightness"></span> <span id="brightness-value" class="control-value">0</span></span>
                                        <input type="range" id="brightness" min="-100" max="100" value="0" step="1" />
                                    </label>
                                    <label data-i18n-title="controls.contrast">
                                        <span class="control-head"><span data-i18n="controls.contrast"></span> <span id="contrast-value" class="control-value">0</span></span>
                                        <input type="range" id="contrast" min="-100" max="100" value="0" step="1" />
                                    </label>
                                    <label data-i18n-title="controls.vibrance">
                                        <span class="control-head"><span data-i18n="controls.vibrance"></span> <span id="vibrance-value" class="control-value">0</span></span>
                                        <input type="range" id="vibrance" min="-100" max="100" value="0" step="1" />
                                    </label>
                                </div>
                                <div class="controls-set flex flex-col gap-2 flex-auto h-full">
                                    <label data-i18n-title="controls.clarity">
                                        <span class="control-head"><span data-i18n="controls.clarity"></span> <span id="clarity-value" class="control-value">0</span></span>
                                        <input type="range" id="clarity" min="-100" max="100" value="0" step="1" />
                                    </label>
                                    <label data-i18n-title="controls.texture">
                                        <span class="control-head"><span data-i18n="controls.texture"></span> <span id="texture-value" class="control-value">0</span></span>
                                        <input type="range" id="texture" min="-100" max="100" value="0" step="1" />
                                    </label>
                                    <label data-i18n-title="controls.simplify">
                                        <span class="control-head"><span data-i18n="controls.simplify"></span> <span id="simplify-value" class="control-value">0</span></span>
                                        <input type="range" id="simplify" min="0" max="100" value="0" step="1" />
                                    </label>
                                    <label data-i18n-title="controls.posterize">
                                        <span class="control-head"><span data-i18n="controls.posterize"></span> <span id="posterize-value" class="control-value">off</span></span>
                                        <input type="range" id="posterize" min="0" max="1000" value="0" step="1" />
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="controls-column-right flex flex-col gap-2 h-full">
                            <div id="display-controls" class="flex flex-auto items-center justify-between gap-2">
                                <div class="flex-fill"></div>
                                <button id="fullscreen-btn" class="toggle-btn" data-i18n-title="controls.mirror" disabled>
                                    <span class="material-symbols-outlined" aria-hidden="true">present_to_all</span>
                                </button>
                                <div class="flex-fill"></div>
                                <button id="mirror-zones-btn" class="toggle-btn" data-i18n-title="controls.mirrorZones">
                                    <span class="material-symbols-outlined" aria-hidden="true">grid_view</span>
                                </button>
                                <button id="show-original-btn" class="toggle-btn" data-i18n-title="controls.showOriginal">
                                    <span class="material-symbols-outlined" aria-hidden="true">compare</span>
                                </button>
                            </div>
                            <div id="chrono" class="chrono-area">
                                <div class="timer"></div>
                                <button id="reset-timer" class="timer-reset-btn icon-btn" type="button" data-i18n-title="chrono.reset">
                                    <span class="material-symbols-outlined" aria-hidden="true">timer</span>
                                </button>
                            </div>
                            <div id="metronome" class="metronome-area">
                                <!-- The title has its own span: data-i18n replaces the
                                     whole text content, the badge must not live inside it -->
                                <h2 class="metronome-title">
                                    <span data-i18n="metronome.title"></span>
                                    <span class="time-signature-fields" data-i18n-title="metronome.timeSignature">
                                        <input type="number" id="time-signature-numerator" class="time-signature-numerator" min="1" max="16" step="1" value="4" data-i18n-title="metronome.timeSignatureNumerator" data-i18n-aria-label="metronome.timeSignatureNumerator" />
                                        <span class="time-signature-sep">/</span>
                                        <select id="time-signature-denominator" class="time-signature-denominator" data-i18n-title="metronome.timeSignatureDenominator" data-i18n-aria-label="metronome.timeSignatureDenominator">
                                            <option value="1">1</option>
                                            <option value="2">2</option>
                                            <option value="4" selected>4</option>
                                            <option value="8">8</option>
                                            <option value="16">16</option>
                                        </select>
                                    </span>
                                    <span id="sync-badge" class="sync-badge hidden" data-i18n="metronome.syncBadge" data-i18n-title="metronome.syncBadge"></span>
                                </h2>

                                <div class="metronome-controls">
                                    <div class="bpm-input-group">
                                        <div class="bpm-step-group">
                                            <button id="bpm-minus10" class="bpm-step" title="-10 BPM">-10</button>
                                            <button id="bpm-minus5" class="bpm-step" title="-5 BPM">-5</button>
                                        </div>
                                        <div class="bpm-input-wrapper">
                                            <input type="number" id="bpm-input" class="bpm-input" min="20" max="300" value="120" />
                                            <div class="bpm-spinner">
                                                <button id="bpm-up" class="bpm-spinner-btn" type="button" title="+1 BPM"><span class="material-symbols-outlined" aria-hidden="true">keyboard_arrow_up</span></button>
                                                <button id="bpm-down" class="bpm-spinner-btn" type="button" title="-1 BPM"><span class="material-symbols-outlined" aria-hidden="true">keyboard_arrow_down</span></button>
                                            </div>
                                        </div>
                                        <div class="bpm-step-group">
                                            <button id="bpm-plus5" class="bpm-step" title="+5 BPM">+5</button>
                                            <button id="bpm-plus10" class="bpm-step" title="+10 BPM">+10</button>
                                        </div>
                                    </div>
                                    <div id="metronome-led" class="metronome-led"></div>
                                </div>

                                <div class="metronome-clock">
                                    <select id="clock-mode-select" class="clock-mode-select" data-i18n-title="metronome.clockMode">
                                        <option value="off" data-i18n="metronome.clockOff"></option>
                                        <option value="auto" data-i18n="metronome.clockAuto" selected></option>
                                        <option value="input" data-i18n="metronome.clockInput"></option>
                                        <option value="master" data-i18n="metronome.clockMaster"></option>
                                    </select>
                                    <select id="clock-source-select" class="clock-source-select hidden" data-i18n-title="metronome.clockSource"></select>
                                </div>

                                
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right column: fixed width -->
        <div class="column column-right">
            <div class="content-area synth-list" id="synth-list">
                <div class="synth-list-body">
                    <div class="synth-tabs"></div>
                    <div class="synth-devices">
                        <div class="synth-list-header">
                            <h2 data-i18n="synthList.title"></h2>
                            <div class="synth-list-header-actions">
                                <button id="play-all-btn" class="synth-list-action synth-list-action-play" data-i18n-title="synthList.playAllStart">
                                    <span class="material-symbols-outlined" aria-hidden="true">play_arrow</span>
                                    <span class="play-all-label"></span>
                                </button>
                                <button id="panic-btn" class="synth-list-action synth-list-action-stop" data-i18n-title="synthList.panic"><span class="material-symbols-outlined" aria-hidden="true">skull</span></button>
                                <div class="flex-fill"></div>
                                <button id="add-synth-btn" class="synth-list-action" data-i18n-title="synthList.add"><span class="material-symbols-outlined" aria-hidden="true">add</span></button>
                            </div>
                        </div>
                        <div class="synth-devices-wrapper">
                            <!-- Synthesizers will be dynamically added here -->
                            <div class="placeholder-text text-muted italic"></div>
                        </div>
                        <div class="footer-area" id="common-controls">
                            <div class="flex items-center gap-3">
                                <div id="language-switcher"></div>
                                <button id="live-help-btn" class="icon-btn" data-i18n-title="controls.help">
                                    <span class="material-symbols-outlined" aria-hidden="true">live_help</span>
                                </button>
                                <button id="show-shortcuts-btn" class="icon-btn" data-i18n-title="config.showShortcuts">
                                    <span class="material-symbols-outlined" aria-hidden="true">keyboard_command_key</span>
                                </button>
                                <button id="open-config-btn" class="icon-btn" data-i18n-title="config.openFile">
                                    <span class="material-symbols-outlined" aria-hidden="true">settings</span>
                                </button>
                                <button id="check-update-btn" class="icon-btn" data-i18n-title="update.check">
                                    <span class="material-symbols-outlined" aria-hidden="true">system_update</span>
                                </button>
                                <div class="flex-fill"></div>
                                <button id="save-session-btn" class="secondary" data-i18n-title="session.save">
                                    <span class="material-symbols-outlined" aria-hidden="true">save</span>
                                </button>
                                <button id="load-session-btn" class="secondary" data-i18n-title="session.load">
                                    <span class="material-symbols-outlined" aria-hidden="true">folder_open</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Unsaved-session confirmation, shown when closing the main window -->
    <div id="session-unsaved-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3 data-i18n="session.unsavedTitle"></h3>
            <p id="session-unsaved-message"></p>
            <div class="modal-actions">
                <div class="flex-fill"></div>
                <button id="session-unsaved-cancel" class="secondary" data-i18n="session.cancelButton"></button>
                <button id="session-unsaved-discard" class="secondary" data-i18n="session.dontSaveButton"></button>
                <button id="session-unsaved-save" class="primary" data-i18n="session.saveButton"></button>
            </div>
        </div>
    </div>

    <!-- Copy another synth's parameters or zones onto a synth -->
    <div id="synth-copy-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3 id="synth-copy-title"></h3>
            <p id="synth-copy-hint" class="text-muted"></p>
            <select id="synth-copy-source" class="synth-copy-source-select"></select>
            <div class="modal-actions">
                <div class="flex-fill"></div>
                <button id="synth-copy-merge" class="primary" data-i18n="synth.copyModeMerge"></button>
                <button id="synth-copy-replace" class="secondary" data-i18n="synth.copyModeReplace"></button>
                <button id="synth-copy-confirm" class="primary" data-i18n="synth.copyActionCopy"></button>
                <button id="synth-copy-cancel" class="secondary" data-i18n="synth.copyCancel"></button>
            </div>
        </div>
    </div>

    <!-- Keyboard shortcuts and mouse gestures (footer keyboard button).
         Static list: keep it in sync with the registerShortcut() calls
         (js/main.js, js/image/editor.js) and the mouse handlers. The
         [data-mod] keys are filled per platform by core/shortcuts-dialog.js. -->
    <div id="shortcuts-modal" class="modal-overlay hidden">
        <div class="modal-box modal-box-wide" role="dialog" aria-modal="true" aria-labelledby="shortcuts-title">
            <h3 id="shortcuts-title" data-i18n="shortcuts.title"></h3>
            <div class="shortcut-groups">
            <section class="shortcut-group">
                <h4 data-i18n="shortcuts.groupPlayback"></h4>
                <dl class="shortcut-list">
                    <dt><kbd data-i18n="shortcuts.keySpace"></kbd></dt><dd data-i18n="shortcuts.playAll"></dd>
                    <dt><kbd data-mod="shift"></kbd><span class="shortcut-plus">+</span><kbd data-i18n="shortcuts.keySpace"></kbd></dt><dd data-i18n="shortcuts.panic"></dd>
                    <dt><kbd>1–8</kbd></dt><dd data-i18n="shortcuts.synthReveal"></dd>
                    <dt><kbd data-mod="primary"></kbd><span class="shortcut-plus">+</span><kbd>1–8</kbd></dt><dd data-i18n="shortcuts.synthToggle"></dd>
                    <dt><kbd data-mod="alt"></kbd><span class="shortcut-plus">+</span><kbd>1–8</kbd></dt><dd data-i18n="shortcuts.synthMute"></dd>
                </dl>
            </section>
            <section class="shortcut-group">
                <h4 data-i18n="shortcuts.groupSession"></h4>
                <dl class="shortcut-list">
                    <dt><kbd data-mod="primary"></kbd><span class="shortcut-plus">+</span><kbd>S</kbd></dt><dd data-i18n="shortcuts.sessionSave"></dd>
                    <dt><kbd data-mod="primary"></kbd><span class="shortcut-plus">+</span><kbd>O</kbd></dt><dd data-i18n="shortcuts.sessionOpen"></dd>
                    <dt><kbd data-mod="primary"></kbd><span class="shortcut-plus">+</span><kbd>Z</kbd></dt><dd data-i18n="shortcuts.undo"></dd>
                    <dt><kbd data-mod="primary"></kbd><span class="shortcut-plus">+</span><kbd data-mod="shift"></kbd><span class="shortcut-plus">+</span><kbd>Z</kbd></dt><dd data-i18n="shortcuts.redo"></dd>
                    <dt><kbd data-mod="primary"></kbd><span class="shortcut-plus">+</span><kbd>M</kbd></dt><dd data-i18n="shortcuts.mirror"></dd>
                    <dt><kbd data-i18n="shortcuts.keyEsc"></kbd></dt><dd data-i18n="shortcuts.escape"></dd>
                </dl>
            </section>
            <section class="shortcut-group">
                <h4 data-i18n="shortcuts.groupImage"></h4>
                <dl class="shortcut-list">
                    <dt><kbd data-i18n="shortcuts.keyEnter"></kbd></dt><dd data-i18n="shortcuts.commit"></dd>
                    <dt><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd></dt><dd data-i18n="shortcuts.perspective"></dd>
                    <dt><kbd data-mod="shift"></kbd><span class="shortcut-plus">+</span><kbd>↑</kbd><kbd>↓</kbd></dt><dd data-i18n="shortcuts.rotation"></dd>
                </dl>
            </section>
            <section class="shortcut-group">
                <h4 data-i18n="shortcuts.groupZones"></h4>
                <dl class="shortcut-list">
                    <dt><span class="shortcut-gesture" data-i18n="shortcuts.gestureDrag"></span></dt><dd data-i18n="shortcuts.zoneAdd"></dd>
                    <dt><kbd data-mod="alt"></kbd><span class="shortcut-plus">+</span><span class="shortcut-gesture" data-i18n="shortcuts.gestureDrag"></span></dt><dd data-i18n="shortcuts.zoneRemove"></dd>
                    <dt><kbd data-mod="shift"></kbd><span class="shortcut-plus">+</span><span class="shortcut-gesture" data-i18n="shortcuts.gestureDrag"></span></dt><dd data-i18n="shortcuts.zoneSilence"></dd>
                    <dt><kbd data-mod="alt"></kbd><span class="shortcut-plus">+</span><kbd data-mod="shift"></kbd><span class="shortcut-plus">+</span><span class="shortcut-gesture" data-i18n="shortcuts.gestureDrag"></span></dt><dd data-i18n="shortcuts.zoneUnsilence"></dd>
                </dl>
            </section>
            <section class="shortcut-group">
                <h4 data-i18n="shortcuts.groupMouse"></h4>
                <dl class="shortcut-list">
                    <dt><span class="shortcut-gesture" data-i18n="shortcuts.gestureDoubleClick"></span></dt><dd data-i18n="shortcuts.dblSlider"></dd>
                    <dt><span class="shortcut-gesture" data-i18n="shortcuts.gestureDoubleClick"></span></dt><dd data-i18n="shortcuts.dblColumns"></dd>
                    <dt><span class="shortcut-gesture" data-i18n="shortcuts.gestureDoubleClick"></span></dt><dd data-i18n="shortcuts.dblRename"></dd>
                    <dt><span class="shortcut-gesture" data-i18n="shortcuts.gestureWheel"></span></dt><dd data-i18n="shortcuts.wheelValue"></dd>
                    <dt><kbd data-mod="shift"></kbd><span class="shortcut-plus">+</span><span class="shortcut-gesture" data-i18n="shortcuts.gestureWheel"></span></dt><dd data-i18n="shortcuts.wheelVelocity"></dd>
                    <dt><span class="shortcut-gesture" data-i18n="shortcuts.gestureWheel"></span></dt><dd data-i18n="shortcuts.wheelVolume"></dd>
                    <dt><span class="shortcut-gesture" data-i18n="shortcuts.gestureDoubleClick"></span></dt><dd data-i18n="shortcuts.dblMirror"></dd>
                </dl>
            </section>
            </div>
            <div class="modal-actions">
                <div class="flex-fill"></div>
                <button id="shortcuts-close" class="primary" data-i18n="shortcuts.close"></button>
            </div>
        </div>
    </div>

    <!-- Update available (footer update button, or the startup check).
         js/core/updater.js fills the version line, the release notes and the
         download progress, then triggers the Rust install command. -->
    <div id="update-modal" class="modal-overlay hidden">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="update-title">
            <h3 id="update-title" data-i18n="update.title"></h3>
            <p id="update-versions"></p>
            <pre id="update-notes" class="update-notes hidden"></pre>
            <div id="update-progress-wrap" class="update-progress-wrap hidden">
                <div id="update-progress" class="update-progress-bar"></div>
            </div>
            <div class="modal-actions">
                <div class="flex-fill"></div>
                <button id="update-later" class="secondary" data-i18n="update.later"></button>
                <button id="update-install" class="primary" data-i18n="update.install"></button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
