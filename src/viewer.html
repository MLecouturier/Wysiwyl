<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wysiwyl</title>
    <link rel="icon" href="assets/icon.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/mirror.css" />
</head>
<body>
    <div class="app-container">
        <div class="column column-left">
            <div class="content-area image-viewer-container" id="image-viewer-container">
                <div id="image-viewer" class="image-viewer">
                    <!-- Bottom layer of the projection stack: the surface
                         not on top (object-fit: contain, like the main
                         viewer). The top layer is the #mirror-top canvas,
                         composited with the active effect's mask. -->
                    <img id="mirror-bottom" class="hidden" alt="" />
                    <canvas id="mirror-top" class="mirror-top"></canvas>
                    <canvas id="trail-overlay" class="trail-overlay"></canvas>
                    <canvas id="pixel-overlay" class="pixel-overlay"></canvas>
                    <canvas id="cursor-overlay" class="cursor-overlay"></canvas>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="js/mirror/view.js"></script>
</body>
</html>
